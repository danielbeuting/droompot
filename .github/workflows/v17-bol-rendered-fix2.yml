name: Fix Bol rendered extraction v2
on:
  push:
    paths:
      - '.github/workflows/v17-bol-rendered-fix2.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch product metadata
        run: |
          echo ' cyp lbl ' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Syntax check
        run: node --check netlify/functions/product-metadata.mjs
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add netlify/functions/product-metadata.mjs
          git commit -m 'Use rendered Bol extraction for price and image'
          git push origin main
