name: Promote Droompot v1.7 clean

on:
  push:
    branches: [v17-clean]
    paths:
      - '.github/workflows/promote-v17.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: v17-clean
      - name: Reconstruct and promote v1.7
        shell: bash
        run: |
          set -euo pipefail
          {
            cat payload/part01a.b64
            head -c 10000 payload/part01b.b64
            cat payload/p2_0 payload/p2_1 payload/p2_2 payload/p2_3 payload/p2_4 payload/p2_5 payload/p2_6 payload/p2_7
            cat payload/part03a1.b64 payload/part03a2.b64 payload/part03b.b64
          } | base64 -d > /tmp/v17.tar.gz
          echo '063d610ba20caf7e32573a5c50d8ff374d01b47fa1be6502bf6349ed164fce58  /tmp/v17.tar.gz' | sha256sum -c -
          cp droompot-pig.png /tmp/droompot-pig.png
          git rm -rf .
          tar -xzf /tmp/v17.tar.gz
          cp /tmp/droompot-pig.png droompot-pig.png
          node --check app.js
          node --check netlify/functions/dream-data.mjs
          node --check netlify/functions/product-metadata.mjs
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Droompot v1.7 pilot'
          git push --force origin HEAD:main
