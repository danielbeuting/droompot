name: Fix Droompot v1.7 wishlist sync and demo popup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v17-wishlist-demo-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch v1.7
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()

          # Demo popup: no longer automatic on page load; show once when entering Droompot.
          s=s.replace('setTimeout(maybeShowDemoNotice,220);','')
          if 'let demoNoticeShown=false;' not in s:
              needle='function closeDemoNotice(){\n  document.getElementById("demo-notice-overlay")?.classList.remove("open");\n  document.getElementById("demo-notice-modal")?.classList.remove("open");\n}\n'
              replacement=needle+'let demoNoticeShown=false;\nfunction showDemoNoticeOnce(){\n  if(demoNoticeShown)return;\n  demoNoticeShown=true;\n  maybeShowDemoNotice();\n}\n'
              if needle not in s:
                  raise SystemExit('demo notice close block not found')
              s=s.replace(needle,replacement,1)

          # Start screen: wishlist is no demo; Droompot shows notice only after click.
          old='document.getElementById("start-dream-btn").addEventListener("click",()=>show("home"));'
          new='document.getElementById("start-dream-btn").addEventListener("click",()=>{show("home");setTimeout(showDemoNoticeOnce,120)});'
          if old not in s:
              raise SystemExit('start dream handler not found')
          s=s.replace(old,new,1)

          old='document.getElementById("wishlist-dreampot-btn").addEventListener("click",()=>show("home"));'
          new='document.getElementById("wishlist-dreampot-btn").addEventListener("click",()=>{show("home");setTimeout(showDemoNoticeOnce,120)});'
          if old in s:
              s=s.replace(old,new,1)

          # Central wishlist claim helper.
          marker='let wishFilter="all";\n'
          if 'async function setWishClaimedOnline' not in s:
              helper='''let wishFilter="all";\nasync function setWishClaimedOnline(id,claimed){\n  const response=await fetch("/.netlify/functions/dream-data",{\n    method:"POST",\n    headers:{"Content-Type":"application/json"},\n    body:JSON.stringify({action:"wish-claim",wishId:id,claimed:Boolean(claimed)})\n  });\n  if(!response.ok)throw new Error("Wish claim save failed");\n  const payload=await response.json();\n  if(payload?.data){\n    state={...clone(DEFAULT),...payload.data};\n    normalizeGoalOrder();\n    save();\n    return true;\n  }\n  return false;\n}\nasync function refreshWishlistFromCentral(){\n  await loadCentralState();\n  renderWishlist();\n}\n'''
              if marker not in s:
                  raise SystemExit('wishFilter marker not found')
              s=s.replace(marker,helper,1)

          # Replace local-only claim toggle with central save.
          old='''  list.querySelectorAll("[data-claim-wish]").forEach(b=>b.addEventListener("click",()=>{\n    const w=state.wishes.find(x=>x.id===Number(b.dataset.claimWish));if(w){w.claimed=!w.claimed;\n      if(w.claimed)celebrateClaimedWish(w.title);save();renderWishlist();toast(w.claimed?"Wens afgestreept":"Wens weer vrij")}\n  }));'''
          new='''  list.querySelectorAll("[data-claim-wish]").forEach(b=>b.addEventListener("click",async()=>{\n    const id=Number(b.dataset.claimWish);\n    const w=state.wishes.find(x=>x.id===id);\n    if(!w)return;\n    const next=!w.claimed;\n    b.disabled=true;\n    try{\n      const ok=await setWishClaimedOnline(id,next);\n      if(!ok)throw new Error("Niet opgeslagen");\n      const updated=state.wishes.find(x=>x.id===id);\n      if(updated?.claimed)celebrateClaimedWish(updated.title);\n      renderWishlist();\n      toast(updated?.claimed?"Wens afgestreept ✓":"Wens weer vrij",true);\n    }catch(err){\n      console.error(err);\n      toast("Afstrepen kon niet online worden opgeslagen");\n      b.disabled=false;\n    }\n  }));'''
          if old not in s:
              raise SystemExit('local claim handler not found')
          s=s.replace(old,new,1)

          # Whenever the wishlist is opened, pull the current shared version first.
          replacements={
            'document.getElementById("start-wishlist-btn").addEventListener("click",()=>{renderWishlist();show("wishlist")});':'document.getElementById("start-wishlist-btn").addEventListener("click",async()=>{show("wishlist");await refreshWishlistFromCentral()});',
            'document.getElementById("home-wishlist-btn").addEventListener("click",()=>{renderWishlist();show("wishlist")});':'document.getElementById("home-wishlist-btn").addEventListener("click",async()=>{show("wishlist");await refreshWishlistFromCentral()});'
          }
          for oldh,newh in replacements.items():
              if oldh not in s:
                  raise SystemExit('wishlist open handler not found: '+oldh[:40])
              s=s.replace(oldh,newh,1)

          p.write_text(s)

          # Backend action for public shared wishlist claiming.
          p=Path('netlify/functions/dream-data.mjs')
          s=p.read_text()
          marker='''    if(body?.action==="contribution"){'''
          block='''    if(body?.action==="wish-claim"){\n      const current=await store.get(DATA_KEY,{type:"json"});\n      if(!current||!Array.isArray(current.wishes))return json({error:"Droompot is nog niet geïnitialiseerd"},409);\n      const wish=current.wishes.find(w=>String(w.id)===String(body.wishId));\n      if(!wish)return json({error:"Wish not found"},404);\n      wish.claimed=Boolean(body.claimed);\n      await store.setJSON(DATA_KEY,current);\n      return json({ok:true,data:current});\n    }\n'''
          if 'body?.action==="wish-claim"' not in s:
              if marker not in s:
                  raise SystemExit('backend contribution marker not found')
              s=s.replace(marker,block+marker,1)
          p.write_text(s)
          PY
          node --check app.js
          node --check netlify/functions/dream-data.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js netlify/functions/dream-data.mjs
          git commit -m "Fix v1.7 wishlist sync and demo popup"
          git push origin main
