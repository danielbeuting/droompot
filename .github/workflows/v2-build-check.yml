name: V2 build check

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://xmzeaiejgmxnizblqllo.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder-for-build-only
      - name: Package working version
        run: zip -r Droompot_V2_working.zip . -x '.git/*' 'node_modules/*' 'Droompot_V2_working.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: Droompot_V2_working
          path: Droompot_V2_working.zip
