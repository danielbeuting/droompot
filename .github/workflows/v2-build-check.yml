name: V2 build check

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://xmzeaiejgmxnizblqllo.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder-for-build-only
