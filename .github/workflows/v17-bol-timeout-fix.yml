name: Fix Droompot Bol timeout regression
on:
  push:
    paths:
      - '.github/workflows/v17-bol-timeout-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch request timeouts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('app.js')
          app = app_path.read_text()
          old = 'const timer=setTimeout(()=>controller.abort(),15000);'
          if old not in app:
              raise SystemExit('frontend 15s timeout not found')
          app = app.replace(old, 'const timer=setTimeout(()=>controller.abort(),30000);', 1)
          app_path.write_text(app)

          fn_path = Path('netlify/functions/product-metadata.mjs')
          fn = fn_path.read_text()
          replacements = [
              ('timeout:12000,headers:{"User-Agent"', 'timeout:4000,headers:{"User-Agent"'),
              ('fetchText(`https://r.jina.ai/${url}`,{timeout:18000', 'fetchText(`https://r.jina.ai/${url}`,{timeout:4000'),
              ('fetchText(api,{timeout:18000', 'fetchText(api,{timeout:4000'),
              ('fetchText(proxy,{timeout:15000', 'fetchText(proxy,{timeout:4000')
          ]
          for old, new in replacements:
              if old in fn:
                  fn = fn.replace(old, new)
          fn_path.write_text(fn)
          PY
      - name: Syntax check
        run: |
          node --check app.js
          node --check netlify/functions/product-metadata.mjs
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js netlify/functions/product-metadata.mjs
          git commit -m 'Fix Bol metadata timeout regression'
          git push origin main
