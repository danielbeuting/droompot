name: Restore exact Droompot v1.5.1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: github.event.head_commit.message != 'Restore exact Droompot v1.5.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct exact v1.5.1 source
        shell: bash
        run: |
          set -euo pipefail
          cat restore-v151/app.*.part | base64 -d | gzip -d > app.js
          cat restore-v151/index.*.part | base64 -d | gzip -d > index.html
          cat restore-v151/style.*.part | base64 -d | gzip -d > style.css
          echo 'b259a17f7dcd25321f65eb1dba95bf5f0edac904971a9cd9a486449f9eb3dbe1  app.js' | sha256sum -c -
          echo '96af4b1d610208ee556919b4ce8619f6b133e391462f0116d34c2673aa332b82  index.html' | sha256sum -c -
          echo '490ae55dc643eefc6822682c7a790900415c120dd0491f55115e9ffee50bb865  style.css' | sha256sum -c -
      - name: Commit exact v1.5.1
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html style.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Restore exact Droompot v1.5.1'
          git push origin HEAD:main
