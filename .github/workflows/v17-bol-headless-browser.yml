name: Add Bol headless browser pilot
on:
  push:
    paths:
      - '.github/workflows/v17-bol-headless-browser.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add Chromium function and route Bol through it
        shell: python
        run: |
          from pathlib import Path
          import json

          fn=Path('netlify/functions/bol-browser.mjs')
          fn.write_text(r'''import chromium from "@sparticuz/chromium";
import puppeteer from "puppeteer-core";

function shortTitle(value=""){
  const words=String(value).replace(/\s+/g," ").trim().split(" ").filter(Boolean);
  return words.slice(0,8).join(" ");
}

export default async (req) => {
  const url=new URL(req.url).searchParams.get("url");
  if(!url) return Response.json({error:"URL ontbreekt"},{status:400});
  let parsed;
  try{parsed=new URL(url);}catch{return Response.json({error:"Ongeldige URL"},{status:400});}
  if(!/(^|\.)bol\.com$/i.test(parsed.hostname)) return Response.json({error:"Alleen bol.com"},{status:400});

  let browser;
  try{
    browser=await puppeteer.launch({
      args:[...chromium.args,"--lang=nl-NL"],
      defaultViewport:{width:1365,height:900},
      executablePath:await chromium.executablePath(),
      headless:chromium.headless
    });
    const page=await browser.newPage();
    await page.setUserAgent("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36");
    await page.setExtraHTTPHeaders({"Accept-Language":"nl-NL,nl;q=0.9,en;q=0.7"});
    await page.goto(url,{waitUntil:"domcontentloaded",timeout:18000});
    await new Promise(r=>setTimeout(r,1800));

    const result=await page.evaluate(()=>{
      const body=(document.body?.innerText||"").replace(/\s+/g," ");
      const title=(document.querySelector('h1')?.textContent||document.title||"").trim();

      let price="";
      const priceSelectors=['[data-test="price"]','[data-test*="price"]','[class*="price"]'];
      for(const sel of priceSelectors){
        for(const el of document.querySelectorAll(sel)){
          const text=(el.textContent||"").replace(/\s+/g," ").trim();
          const m=text.match(/(?:€\s*)?(\d{1,5})[,.](\d{2})/);
          if(m){ price=`${m[1]}.${m[2]}`; break; }
        }
        if(price)break;
      }
      if(!price){
        let m=body.match(/De prijs van dit product is\s*(\d{1,5})\s*euro(?:\s*en\s*(\d{1,2})\s*cent)?/i);
        if(m)price=`${m[1]}.${String(m[2]||"00").padStart(2,"0")}`;
      }
      if(!price){
        const m=body.match(/(?:Prijsinformatie en bestellen|Prijs)[\s\S]{0,500}?(\d{1,5})[,.](\d{2})/i);
        if(m)price=`${m[1]}.${m[2]}`;
      }

      const bad=/(logo|icon|sprite|avatar|placeholder|badge|favicon|brand|header|footer|payment|service|usp|newsletter|banner)/i;
      const titleWords=title.toLowerCase().split(/\s+/).filter(w=>w.length>3).slice(0,6);
      const imgs=[...document.images].map(img=>({
        src:img.currentSrc||img.src||"",
        alt:img.alt||"",
        w:img.naturalWidth||img.width||0,
        h:img.naturalHeight||img.height||0
      })).filter(x=>/media\.s-bol\.com/i.test(x.src)&&!bad.test(x.src));
      const score=x=>{
        let n=0;
        if(x.w>=500||x.h>=500)n+=50;
        if(x.w>=900||x.h>=900)n+=30;
        const a=x.alt.toLowerCase();
        n+=titleWords.filter(w=>a.includes(w)).length*25;
        if(/lego|ninjago|wyldfyre|product/i.test(a))n+=25;
        return n;
      };
      imgs.sort((a,b)=>score(b)-score(a));
      return {title,price,image:imgs[0]?.src||"",debug:{url:location.href,images:imgs.length}};
    });

    result.title=shortTitle(result.title);
    return Response.json(result,{headers:{"Cache-Control":"no-store"}});
  }catch(err){
    return Response.json({error:err?.message||"Bol-browser mislukt"},{status:502});
  }finally{
    try{await browser?.close();}catch{}
  }
};
''')

          pkg=Path('package.json')
          data=json.loads(pkg.read_text())
          deps=data.setdefault('dependencies',{})
          deps['@sparticuz/chromium']='^140.0.0'
          deps['puppeteer-core']='^24.16.0'
          pkg.write_text(json.dumps(data,indent=2)+"\n")

          app=Path('app.js')
          s=app.read_text()
          old='const endpoint=`/api/product-metadata?url=${encodeURIComponent(url)}`;'
          new='const endpoint=/https?:\\/\\/(?:www\\.)?bol\\.com\\//i.test(url)?`/.netlify/functions/bol-browser?url=${encodeURIComponent(url)}`:`/api/product-metadata?url=${encodeURIComponent(url)}`;'
          if old not in s:
            raise SystemExit('metadata endpoint line not found')
          app.write_text(s.replace(old,new,1))
      - name: Install and syntax check
        run: |
          npm install --package-lock-only
          node --check app.js
          node --check netlify/functions/bol-browser.mjs
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js package.json package-lock.json netlify/functions/bol-browser.mjs
          git commit -m 'Use local headless Chromium for Bol metadata'
          git push origin main
