name: Fix Droompot v1.7 refresh and save feedback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v17-sync-refresh-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch app.js
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')

          old='const response=await fetch("/.netlify/functions/dream-data",{cache:"no-store"});'
          new='const response=await fetch(`/.netlify/functions/dream-data?t=${Date.now()}`,{cache:"no-store",headers:{"Cache-Control":"no-cache"}});'
          if old not in s:
              raise SystemExit('loadCentralState fetch pattern not found')
          s=s.replace(old,new,1)

          old_save='''document.getElementById("save-settings-btn").addEventListener("click",async()=>{
            syncSettingsFormToDraft();

            if(settingsDraft){
              settingsDraft.childName=(settingsDraft.childName||"").trim()||"Noï";
              state=clone(settingsDraft);
            }

            save();
            const synced=await saveCentralState();
            settingsSnapshot=null;
            settingsDraft=null;
            render();
            settingsSnapshot=clone(state);
            settingsDraft=clone(state);
            render();
            renderSettingsWishList();
            renderSettingsContributions();
            show("settings");
            setTimeout(()=>toast("Wijzigingen opgeslagen!",true),120);
          });'''
          new_save='''document.getElementById("save-settings-btn").addEventListener("click",async()=>{
            const button=document.getElementById("save-settings-btn");
            const originalText=button.textContent;
            button.disabled=true;
            button.textContent="Opslaan…";

            syncSettingsFormToDraft();

            if(settingsDraft){
              settingsDraft.childName=(settingsDraft.childName||"").trim()||"Noï";
              state=clone(settingsDraft);
            }

            save();
            const synced=await saveCentralState();
            settingsSnapshot=null;
            settingsDraft=null;
            render();
            settingsSnapshot=clone(state);
            settingsDraft=clone(state);
            render();
            renderSettingsWishList();
            renderSettingsContributions();
            show("settings");

            if(synced){
              button.textContent="Opgeslagen ✓";
              toast("Opgeslagen — wijzigingen staan direct live",true);
              setTimeout(()=>{button.textContent=originalText;button.disabled=false;},1600);
            }else{
              button.textContent="Niet online opgeslagen";
              toast("Online opslaan is niet gelukt");
              setTimeout(()=>{button.textContent=originalText;button.disabled=false;},2200);
            }
          });'''
          if old_save not in s:
              raise SystemExit('save handler pattern not found')
          s=s.replace(old_save,new_save,1)

          old_boot='normalizeGoalOrder();save();render();setAmount(20);loadCentralState();'
          new_boot='''async function bootDroompot(){
            normalizeGoalOrder();
            setAmount(20);
            const loaded=await loadCentralState();
            if(!loaded){
              save();
              render();
            }
          }
          bootDroompot();

          let lastPublicRefresh=0;
          async function refreshPublicState(){
            if(isAdminLoggedIn() || settingsDraft)return;
            const now=Date.now();
            if(now-lastPublicRefresh<1500)return;
            lastPublicRefresh=now;
            await loadCentralState();
          }
          window.addEventListener("pageshow",refreshPublicState);
          window.addEventListener("focus",refreshPublicState);
          document.addEventListener("visibilitychange",()=>{
            if(!document.hidden)refreshPublicState();
          });'''
          if old_boot not in s:
              raise SystemExit('boot pattern not found')
          s=s.replace(old_boot,new_boot,1)

          p.write_text(s,encoding='utf-8')
          PY
          node --check app.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'Fix v1.7 public refresh and save feedback'
          git push origin main
